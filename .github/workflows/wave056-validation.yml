name: Wave 056 validation

on:
  push:
    branches: [task/compiler-capability-catalog-synthesis-055]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared runtime and test runner
        run: python -m pip install pypdf==6.14.2 pytest==9.0.3
      - name: Compile Python sources
        run: python -m compileall -q tools/course_compiler_demo tests/course_compiler_demo
      - name: Full compiler suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider tests/course_compiler_demo
      - name: Git-less clean-room suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          clean_root="$(mktemp -d)"
          cp -R .axiomiq docs reports schemas tests tools requirements.in requirements.lock "$clean_root"/
          cd "$clean_root"
          test ! -e .git
          python -m pytest -p no:cacheprovider tests/course_compiler_demo
