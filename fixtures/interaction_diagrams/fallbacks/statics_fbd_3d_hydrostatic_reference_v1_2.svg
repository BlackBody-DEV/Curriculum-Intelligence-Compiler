<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Three-dimensional hydrostatic free-body diagram</title>
  <desc id="desc">An inclined submerged plane with x, y, and z axes, origin O, hydrostatic resultant force F, reaction moment M, centroid depth h c, inclination theta, and center-of-pressure depth h cp.</desc>
  <rect width="640" height="400" fill="white" stroke="black"/><line x1="90" y1="320" x2="220" y2="320" stroke="black"/><line x1="90" y1="320" x2="90" y2="170" stroke="black"/><line x1="90" y1="320" x2="35" y2="365" stroke="black"/><text x="225" y="325">x</text><text x="80" y="160">y</text><text x="20" y="380">z</text><text x="75" y="340">O</text><polygon points="270,110 500,170 430,330 200,270" fill="#d9edf7" stroke="#205072"/><line x1="350" y1="220" x2="470" y2="105" stroke="#b00020" stroke-width="4"/><text x="478" y="100">F (N)</text><path d="M310 235 A55 55 0 0 1 365 280" fill="none" stroke="#6a1b9a" stroke-width="3"/><text x="365" y="290">M (N·m)</text><line x1="540" y1="60" x2="540" y2="220" stroke="#087f23"/><text x="548" y="120">h_c</text><line x1="585" y1="60" x2="585" y2="255" stroke="#087f23"/><text x="592" y="160">h_cp</text><text x="260" y="350">inclination θ</text>
</svg>
