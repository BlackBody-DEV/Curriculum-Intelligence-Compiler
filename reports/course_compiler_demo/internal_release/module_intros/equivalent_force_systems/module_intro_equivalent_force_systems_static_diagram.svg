<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-labelledby="title desc" data-diagram-fingerprint="8633ab0e59bac4c26e3a75fba2303ec5bafc63e3b2d020c41b9a67da4aa318ca"><title id="title">Static Equivalent Force Systems overview showing the topic model and entry geometry; all 3 signed procedures are represented by the accompanying ordered procedure overview.</title><desc id="desc">Resolve and combine coplanar forces, then determine the magnitude and direction of the single resultant while preserving axis and quadrant conventions. Static-only figure with no controls, adjustable variables, or step states.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#175CD3"/></marker></defs><style>text{font:15px system-ui;fill:#101828}path{stroke:#344054;stroke-width:2.5;fill:none}.body{fill:#EAF2FF;stroke:#344054}.force,.resultant{stroke:#175CD3;stroke-width:3;marker-end:url(#arrow)}.resultant{stroke:#B42318}.guide,.cut{stroke:#667085;stroke-dasharray:6 5}.moment{stroke:#7A5AF8;stroke-width:3;marker-end:url(#arrow)}circle{fill:#101828}</style><rect width="660" height="360" fill="#fff"/><text x="24" y="28">STATICS_RESULTANT_FORCES · static module introduction</text><path d="M70 270H590M100 300V45"/><text x="575" y="292">x</text><text x="82" y="58">y</text><path class="force" d="M180 240L320 105M180 240L455 175"/><path class="resultant" d="M180 240L475 65"/><path class="moment" d="M480 205A55 55 0 0 0 535 150"/><text x="300" y="145">ΣF</text><text x="490" y="145">ΣM</text><text x="24" y="340">Topic-scope binding: 3 signed procedures · human review required</text></svg>