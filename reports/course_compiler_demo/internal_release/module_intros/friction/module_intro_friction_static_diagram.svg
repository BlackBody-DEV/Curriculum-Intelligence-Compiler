<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-labelledby="title desc" data-diagram-fingerprint="1dc5b4a613e908256acfc437fc623de157294b61ac583b9e1b1e53da7025cd4d"><title id="title">Static Friction overview showing the topic model and entry geometry; all 11 signed procedures are represented by the accompanying ordered procedure overview.</title><desc id="desc">Model dry-friction contacts and determine static, impending, or kinetic regimes across sliding, tipping, wedges, screws, belts, collars, bearings, and rolling resistance. Static-only figure with no controls, adjustable variables, or step states.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#175CD3"/></marker></defs><style>text{font:15px system-ui;fill:#101828}path{stroke:#344054;stroke-width:2.5;fill:none}.body{fill:#EAF2FF;stroke:#344054}.force,.resultant{stroke:#175CD3;stroke-width:3;marker-end:url(#arrow)}.resultant{stroke:#B42318}.guide,.cut{stroke:#667085;stroke-dasharray:6 5}.moment{stroke:#7A5AF8;stroke-width:3;marker-end:url(#arrow)}circle{fill:#101828}</style><rect width="660" height="360" fill="#fff"/><text x="24" y="28">STATICS_FRICTION · static module introduction</text><path d="M70 270H590M100 300V45"/><text x="575" y="292">x</text><text x="82" y="58">y</text><rect class="body" x="235" y="165" width="150" height="80"/><path class="force" d="M310 165V75M310 245V320M235 210H125M385 210H500"/><text x="320" y="92">N</text><text x="320" y="312">W</text><text x="145" y="198">friction</text><text x="455" y="198">applied</text><text x="24" y="340">Topic-scope binding: 11 signed procedures · human review required</text></svg>